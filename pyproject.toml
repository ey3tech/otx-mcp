[project]
name = "otx-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=3.4.2",
    "msgspec>=0.21.1",
    "otx-py",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.55",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.uv.sources]
otx-py = { git = "https://github.com/ey3tech/otx-py" }
